<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>eyes on · 影视音观看记录工作台</title>
<style>
  :root{
    --blue:#5b9df9;
    --pink:#ff8fc4;
    --ink:#4a4a5a;
    --ink-soft:#8a8a99;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.72);
    --glass-border:rgba(255,255,255,0.75);
    --shadow:0 8px 30px rgba(120,140,200,0.18);
    --shadow-soft:0 4px 16px rgba(120,140,200,0.12);
    --radius:20px;
    --c-wish:#7aa7ff;
    --c-watching:#ff9ec7;
    --c-done:#7fd6a6;
    --c-dropped:#c3b1e6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#a8d8ff 0%,#cfeffe 38%,#ffd9ec 100%);
    background-attachment:fixed;
    min-height:100vh;
    padding:20px 16px 118px;
    position:relative;
    overflow-x:hidden;
  }
  body::before,body::after{
    content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:0.5;z-index:0;pointer-events:none;
  }
  body::before{width:340px;height:340px;background:#9ec9ff;top:-90px;left:-70px;}
  body::after{width:360px;height:360px;background:#ffb6da;bottom:-110px;right:-90px;}

  .wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1;}

  .glass{
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--glass-border);
    box-shadow:var(--shadow);
    border-radius:var(--radius);
  }

  /* ---------- 顶栏：搜索 + 添加 始终同一行 ---------- */
  header.top{padding:16px 20px;margin-bottom:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .title-block{flex:1 1 auto;min-width:0;}
  .title-block h1{font-size:22px;font-weight:700;letter-spacing:1px;}
  .title-block p{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .head-row{display:flex;align-items:center;gap:9px;flex:1 1 300px;max-width:470px;min-width:0;flex-wrap:nowrap;}
  .search{position:relative;flex:1 1 auto;min-width:0;}
  .search input{
    width:100%;padding:10px 14px 10px 36px;border:none;border-radius:13px;
    background:var(--glass-strong);box-shadow:var(--shadow-soft);font-size:16px;color:var(--ink);outline:none;
  }
  .search input::placeholder{color:var(--ink-soft);}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;}
  .btn{
    border:none;cursor:pointer;font-size:13.5px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--pink));
    padding:10px 18px;border-radius:13px;box-shadow:0 6px 16px rgba(120,140,200,0.3);
    transition:transform .12s ease, box-shadow .12s ease;white-space:nowrap;flex:0 0 auto;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(120,140,200,0.4);}
  .btn:active{transform:translateY(0);}
  .btn.ghost{background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-soft);}
  .btn.ghost:hover{background:#fff;}
  .btn.ghost.danger{color:#e06a8b;}

  /* ---------- 筛选：单行横向滑动，不再占大块 ---------- */
  .filters{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:9px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    border:1px solid var(--glass-border);background:var(--glass);cursor:pointer;flex:0 0 auto;
    padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--ink);
    box-shadow:var(--shadow-soft);transition:all .15s ease;user-select:none;display:flex;align-items:center;gap:5px;
  }
  .chip:hover{background:var(--glass-strong);}
  .chip.active{background:#fff;color:var(--ink);border-color:var(--glass-border);font-weight:700;box-shadow:0 4px 12px rgba(120,140,200,0.18);}
  .chip .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .chip.dashed{border-style:dashed;color:var(--ink-soft);}

  .filter-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
  .filter-group{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px;}
  .filter-group::-webkit-scrollbar{display:none;}
  .filter-group .lbl{font-size:11.5px;color:var(--ink-soft);flex:0 0 auto;margin-right:1px;}
  .pill{
    cursor:pointer;padding:5px 12px;border-radius:999px;font-size:12px;flex:0 0 auto;
    background:var(--glass);border:1px solid var(--glass-border);color:var(--ink);box-shadow:var(--shadow-soft);
    transition:all .15s ease;user-select:none;
  }
  .pill:hover{background:var(--glass-strong);}
  .pill.active{background:#fff;color:var(--ink);border-color:var(--glass-border);font-weight:700;box-shadow:0 4px 12px rgba(120,140,200,0.18);}

  /* ---------- 统计：紧凑 ---------- */
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:14px;}
  .stat{padding:11px 8px;text-align:center;}
  .stat .num{font-size:19px;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- 卡片：展示型轻卡片 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:11px;}
  .card{padding:13px 14px;display:flex;flex-direction:column;gap:7px;position:relative;transition:transform .15s ease,box-shadow .15s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(120,140,200,0.24);}
  .card .meta{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;padding-right:74px;white-space:nowrap;overflow:hidden;}
  .card .meta .cn{flex:0 0 auto;}
  .card .meta .pf{overflow:hidden;text-overflow:ellipsis;}
  .card .meta .sep{opacity:.55;flex:0 0 auto;}
  .card .name{font-size:15.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .stat-line{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .card .stat-line .sd{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .bar{height:6px;border-radius:999px;background:rgba(120,140,200,0.16);overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--pink));opacity:.72;}
  .card .stars{position:absolute;top:13px;right:14px;font-size:12.5px;letter-spacing:.5px;color:#ffb84d;line-height:1;}
  .stars .off{color:rgba(120,140,200,0.25);}
  .card .acts{display:flex;gap:6px;margin-top:1px;}
  .mini{
    flex:1;border:none;cursor:pointer;font-size:12px;font-weight:600;padding:7px 0;border-radius:10px;
    background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-soft);transition:all .12s ease;white-space:nowrap;
  }
  .mini:hover{background:#fff;}
  .mini.primary{background:linear-gradient(135deg,var(--blue),var(--pink));color:#fff;box-shadow:0 5px 14px rgba(120,140,200,0.26);}
  .mini.danger{color:#e06a8b;}
  .empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);padding:44px 0;font-size:13.5px;}

  .sec-title{display:flex;align-items:center;gap:10px;margin:20px 0 11px;}
  .sec-title h2{font-size:16px;font-weight:700;}
  .sec-title .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(120,140,200,0.25),transparent);}

  /* ---------- 数据 / 报告 ---------- */
  .data-card{padding:17px 19px;display:flex;flex-direction:column;gap:12px;}
  .data-card .hint{font-size:12.5px;color:var(--ink-soft);line-height:1.7;}
  .data-card .meta-line{font-size:12px;color:var(--ink-soft);}
  .data-acts{display:flex;gap:9px;flex-wrap:wrap;}
  .data-acts .btn{flex:1 1 130px;text-align:center;}

  .report-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:13px;}
  .report-card{padding:19px;}
  .report-card h3{font-size:15px;margin-bottom:12px;}
  .report-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
  .rs{background:var(--glass-strong);border-radius:13px;padding:11px 13px;box-shadow:var(--shadow-soft);}
  .rs .n{font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .rs .t{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .cat-bars{display:flex;flex-direction:column;gap:8px;}
  .cat-bar{display:flex;align-items:center;gap:9px;font-size:12px;}
  .cat-bar .nm{width:60px;color:var(--ink-soft);flex:0 0 auto;}
  .cat-bar .track{flex:1;height:8px;border-radius:999px;background:rgba(120,140,200,0.16);overflow:hidden;}
  .cat-bar .track > i{display:block;height:100%;border-radius:999px;opacity:.7;}
  .cat-bar .vv{width:30px;text-align:right;color:var(--ink-soft);flex:0 0 auto;}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .badge{
    display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:13px;font-size:12px;
    background:var(--glass-strong);box-shadow:var(--shadow-soft);opacity:.4;filter:grayscale(.6);transition:all .2s ease;
  }
  .badge.on{opacity:1;filter:none;background:linear-gradient(135deg,rgba(91,157,249,0.18),rgba(255,143,196,0.18));}
  .badge .bd{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}

  /* ---------- 底部 tab ---------- */
  .bottom-nav{
    position:fixed;left:50%;transform:translateX(-50%);bottom:14px;
    width:calc(100% - 32px);max-width:420px;display:flex;gap:6px;padding:7px;z-index:45;
    background:rgba(255,255,255,0.74);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--glass-border);
    border-radius:22px;box-shadow:0 12px 34px rgba(120,140,200,0.26);
  }
  .bottom-nav .tab{
    flex:1;text-align:center;padding:10px 0;border-radius:16px;font-size:13.5px;font-weight:600;
    color:var(--ink-soft);cursor:pointer;user-select:none;transition:all .18s ease;
  }
  .bottom-nav .tab:hover{color:var(--ink);}
  .bottom-nav .tab.active{
    color:var(--ink);background:#fff;
    box-shadow:0 5px 14px rgba(120,140,200,0.2);
  }

  .mask{position:fixed;inset:0;background:rgba(80,90,130,0.28);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:60;padding:18px;}
  .mask.show{display:flex;}
  .modal{width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px;animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.96);opacity:.6;}to{transform:scale(1);opacity:1;}}
  .modal h3{font-size:17px;margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 13px;border:none;border-radius:12px;background:var(--glass-strong);
    box-shadow:var(--shadow-soft);font-size:16px;color:var(--ink);outline:none;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .date-row{display:flex;gap:8px;align-items:center;}
  .date-row input{flex:1 1 auto;min-width:0;}
  .date-row .mini{flex:0 0 auto;}
  .date-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .date-chip{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);
    background:var(--glass-strong);box-shadow:var(--shadow-soft);
    padding:5px 9px;border-radius:999px;
  }
  .date-chip.today{background:var(--glass-strong);border:1px solid rgba(120,140,200,0.3);}
  .date-chip b{font-weight:600;}
  .date-chip i{cursor:pointer;font-style:normal;color:var(--ink-soft);font-size:14px;line-height:1;padding:0 1px;}
  .date-chip i:hover{color:#e0537a;}
  .date-empty{font-size:12px;color:var(--ink-soft);margin-top:8px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .rate-pick{display:flex;gap:6px;font-size:25px;cursor:pointer;}
  .rate-pick span{color:rgba(120,140,200,0.3);transition:transform .1s;}
  .rate-pick span.on{color:#ffb84d;}
  .rate-pick span:active{transform:scale(1.2);}
  .modal-acts{display:flex;gap:10px;margin-top:6px;}
  .modal-acts .btn{flex:1;}
  .hidden{display:none !important;}

  .toast{
    position:fixed;left:50%;bottom:98px;transform:translateX(-50%) translateY(10px);
    background:rgba(74,74,90,0.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:14px;
    z-index:90;opacity:0;transition:all .22s ease;pointer-events:none;white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 月历（参考追文记 Apple 风格月视图） */
  .cal-card{padding:18px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:9px;}
  .cal-title{font-size:18px;font-weight:700;letter-spacing:.5px;}
  .cal-nav{display:flex;gap:7px;}
  .cal-nav .mini{flex:0 0 auto;padding:7px 14px;border-radius:11px;}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:7px;}
  .cal-week span{text-align:center;font-size:12px;color:var(--ink-soft);padding:4px 0;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-cell{background:var(--glass-strong);border-radius:12px;min-height:100px;padding:6px 7px;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:3px;overflow:hidden;border:1.5px solid transparent;}
  .cal-cell.dim{opacity:.38;}
  .cal-cell.today{border-color:var(--blue);}
  .cal-dn{font-size:12px;color:var(--ink-soft);align-self:flex-start;line-height:1.3;}
  .cal-cell.today .cal-dn{color:var(--blue);font-weight:700;}
  .cal-rows{display:flex;flex-direction:column;gap:3px;margin-top:1px;}
  .cal-row{height:18px;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink);border-radius:7px;padding:0 6px;cursor:pointer;white-space:nowrap;overflow:hidden;transition:filter .12s;border:1px solid transparent;}
  .cal-row:hover{filter:brightness(0.94);}
  .cal-row.ph{background:transparent !important;border-color:transparent !important;cursor:default;}
  .cal-row.ph:hover{filter:none;}
  .cal-tt{overflow:hidden;text-overflow:ellipsis;}
  .cal-more{font-size:10.5px;color:var(--ink-soft);padding-left:2px;}

  @media(max-width:720px){
    .title-block{flex:1 1 100%;}
    .head-row{flex:1 1 100%;max-width:none;}
    .btn{padding:10px 15px;font-size:13px;}
    .stats{grid-template-columns:repeat(3,1fr);gap:8px;}
    .stat{padding:9px 6px;}
    .stat .num{font-size:17px;}
    .report-grid{grid-template-columns:1fr;}
    .cal-cell{min-height:78px;}
    .cal-dn{font-size:11px;}
    .cal-row{height:14px;font-size:10px;padding:0 4px;}
  }
  @media(max-width:480px){
    body{padding:16px 13px 112px;}
    header.top{padding:14px 16px;}
    .stats{grid-template-columns:repeat(3,1fr);}
    .grid{grid-template-columns:1fr;}
    .cal-cell{min-height:64px;padding:5px 4px;}
    .cal-dn{font-size:10px;}
    .cal-row{height:13px;font-size:9px;padding:0 3px;}
    .data-acts .btn{flex:1 1 100%;}
    .two{grid-template-columns:1fr;}
    .modal{padding:18px 15px 22px;}
    .search input{padding:11px 14px 11px 36px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top glass">
    <div class="title-block">
      <h1>eyes on</h1>
      <p>电视剧 · 电影 · 综艺 · 动漫 · 播客 · 纪录片，一站记录（分类可自定义）</p>
    </div>
    <div class="head-row">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="搜索片名 / 平台…" />
      </div>
      <button class="btn" id="addBtn">＋ 添加</button>
    </div>
  </header>

  <!-- ============ 档案 ============ -->
  <section id="viewList">
    <div class="filters" id="catFilters"></div>

    <div class="filter-row" id="statusRow">
      <div class="filter-group">
        <span class="lbl">状态</span>
        <span class="pill active" data-status="all">全部</span>
        <span class="pill" data-status="wish">想看</span>
        <span class="pill" data-status="watching">在看</span>
        <span class="pill" data-status="done">看过</span>
        <span class="pill" data-status="dropped">弃剧</span>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="grid" id="grid"></div>
  </section>

  <!-- ============ 日历 ============ -->
  <section id="viewCal" class="hidden">
    <div class="cal-card glass" id="calCard">
      <div class="cal-head">
        <div class="cal-title" id="calTitle"></div>
        <div class="cal-nav">
          <button class="mini" id="calPrev">‹ 上月</button>
          <button class="mini" id="calToday">今天</button>
          <button class="mini" id="calNext">下月 ›</button>
        </div>
      </div>
      <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </section>

  <!-- ============ 数据 ============ -->
  <section id="viewData" class="hidden">
    <div class="sec-title"><h2>数据备份</h2><span class="line"></span></div>
    <div class="data-card glass">
      <p class="hint">记录会自动保存在本机浏览器，关掉页面也不会丢。换设备、换浏览器或清理浏览器数据前，建议先「保存数据」留一份备份文件；导入该文件即可在新设备恢复。</p>
      <div class="meta-line" id="saveMeta"></div>
      <div class="data-acts">
        <button class="btn" id="saveDataBtn">保存数据</button>
        <button class="btn ghost" id="importBtn">导入数据</button>
        <button class="btn ghost danger" id="clearBtn">清空数据</button>
      </div>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>

    <div class="sec-title"><h2>年度报告 &amp; 成就</h2><span class="line"></span></div>
    <div class="report-grid">
      <div class="report-card glass" id="reportCard">
        <h3 id="reportYearTitle">今年回顾</h3>
        <div class="report-stats" id="reportStats"></div>
        <h3 style="margin-top:4px;">类别分布</h3>
        <div class="cat-bars" id="catBars"></div>
        <button class="btn ghost" id="downloadReport" style="margin-top:14px;width:100%;">下载分享图 (PNG)</button>
      </div>
      <div class="report-card glass">
        <h3>成就徽章</h3>
        <div class="badges" id="badges"></div>
      </div>
    </div>
  </section>

</div>

<!-- 底部 tab -->
<nav class="bottom-nav">
  <div class="tab active" data-view="list">档案</div>
  <div class="tab" data-view="cal">日历</div>
  <div class="tab" data-view="data">数据</div>
</nav>

<div class="toast" id="toast"></div>

<!-- Entry modal -->
<div class="mask" id="mask">
  <div class="modal glass">
    <h3 id="modalTitle">添加记录</h3>
    <div class="field">
      <label>片名</label>
      <input id="f_title" type="text" placeholder="例如：繁花 / 三体 / 螺丝在拧紧">
    </div>
    <div class="two">
      <div class="field">
        <label>类别</label>
        <select id="f_cat"></select>
      </div>
      <div class="field">
        <label>状态</label>
        <select id="f_status">
          <option value="wish">想看</option>
          <option value="watching">在看</option>
          <option value="done">看过</option>
          <option value="dropped">弃剧</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>平台 / 来源</label>
      <input id="f_platform" type="text" placeholder="例如：腾讯视频 / 爱奇艺 / B站 / 小宇宙 / 网易云">
    </div>
    <div class="field">
      <label>观看日期（决定日历色条，可补录历史）</label>
      <div class="date-row">
        <input id="f_date" type="date">
        <button type="button" class="mini" id="addDateBtn">添加此日</button>
      </div>
      <div class="date-chips" id="datesList"></div>
    </div>
    <div class="two">
      <div class="field">
        <label>进度（当前）</label>
        <input id="f_current" type="number" min="0" value="0">
      </div>
      <div class="field">
        <label>总量</label>
        <input id="f_total" type="number" min="0" value="0">
      </div>
    </div>
    <div class="two">
      <div class="field">
        <label>单位</label>
        <select id="f_unit">
          <option value="集">集</option>
          <option value="期">期</option>
          <option value="分钟">分钟</option>
        </select>
      </div>
      <div class="field" id="perEpWrap">
        <label>单集时长（分钟，用于时长统计）</label>
        <input id="f_perep" type="number" min="0" value="0">
      </div>
    </div>
    <div class="field">
      <label>评分</label>
      <div class="rate-pick" id="ratePick">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>
    <div class="field">
      <label>短评</label>
      <input id="f_review" type="text" placeholder="一句话感受…">
    </div>
    <div class="field">
      <label>摘抄 / 笔记</label>
      <textarea id="f_note" placeholder="台词、观点、灵感…"></textarea>
    </div>
    <div class="modal-acts">
      <button class="btn ghost" id="cancelBtn" style="flex:0 0 100px;">取消</button>
      <button class="btn" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- Category modal -->
<div class="mask" id="catMask">
  <div class="modal glass">
    <h3>新增分类</h3>
    <div class="field">
      <label>分类名称</label>
      <input id="cat_name" type="text" placeholder="例如：舞台剧 / 话剧 / 演唱会">
    </div>
    <div class="two">
      <div class="field">
        <label>进度单位</label>
        <select id="cat_unit">
          <option value="集">集</option>
          <option value="期">期</option>
          <option value="分钟">分钟</option>
        </select>
      </div>
      <div class="field">
        <label>主题色</label>
        <input id="cat_color" type="color" value="#5b9df9" style="height:42px;padding:4px;cursor:pointer;">
      </div>
    </div>
    <div class="modal-acts">
      <button class="btn ghost" id="catCancel" style="flex:0 0 100px;">取消</button>
      <button class="btn" id="catSave">添加</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const KEY="yingyinji_v1";
  const CATS_KEY="yingyinji_cats_v1";
  const BACKUP_KEY="yingyinji_lastbackup_v1";
  const DEFAULT_CATS={
    tv:{name:"电视剧",unit:"集",color:"#5b9df9"},
    movie:{name:"电影",unit:"分钟",color:"#ff8fc4"},
    variety:{name:"综艺",unit:"集",color:"#7fd6a6"},
    anime:{name:"动漫",unit:"集",color:"#c3b1e6"},
    podcast:{name:"播客",unit:"期",color:"#ffb84d"},
    doc:{name:"纪录片",unit:"分钟",color:"#6fd0d8"}
  };
  const PALETTE=["#5b9df9","#ff8fc4","#7fd6a6","#c3b1e6","#ffb84d","#6fd0d8","#ff9e7a","#9b8cff"];
  let CAT=loadCats();
  function loadCats(){
    try{const raw=localStorage.getItem(CATS_KEY);if(raw){const d=JSON.parse(raw);if(d&&typeof d==="object"&&Object.keys(d).length)return d;}}catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT_CATS));
  }
  function saveCats(){localStorage.setItem(CATS_KEY,JSON.stringify(CAT));}

  const STATUS={
    wish:{name:"想看",color:"var(--c-wish)"},
    watching:{name:"在看",color:"var(--c-watching)"},
    done:{name:"看过",color:"var(--c-done)"},
    dropped:{name:"弃剧",color:"var(--c-dropped)"}
  };

  let items=load();
  items.forEach(it=>{
    if(!it.marks||typeof it.marks!=="object") it.marks={};
    if(it.last && !Object.keys(it.marks).length) it.marks[it.last]=true;
  });
  let filter={cat:"all",status:"all",q:""};
  let editingId=null;
  let curRate=0;
  let pendingDates=[];   // 当前编辑中的观看日期（键为 YYYY-M-D，与日历一致）
  let view="list";
  let calY=new Date().getFullYear(), calM=new Date().getMonth();

  function load(){
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){const d=JSON.parse(raw); if(d.items) return d.items;}
    }catch(e){}
    return seed();
  }
  function save(){localStorage.setItem(KEY,JSON.stringify({items:items,seeded:true}));}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function todayStr(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
  function year(){return new Date().getFullYear();}
  /* 日期键统一为 YYYY-M-D（不补零），与日历渲染保持一致 */
  function keyFromInput(v){
    if(!v) return "";
    const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v.trim());
    if(!m) return "";
    return Number(m[1])+"-"+Number(m[2])+"-"+Number(m[3]);
  }
  function inputFromKey(k){
    const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(k||"");
    if(!m) return "";
    return m[1]+"-"+pad2(Number(m[2]))+"-"+pad2(Number(m[3]));
  }
  function keyToDate(k){
    const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(k||"");
    if(!m) return null;
    return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  }
  function dateLabel(k){
    const t=todayStr();
    if(k===t) return "今天";
    const d=keyToDate(k);
    if(d){
      const y=new Date();
      const yd=new Date(y.getFullYear(),y.getMonth(),y.getDate()-1);
      if(d.getFullYear()===yd.getFullYear()&&d.getMonth()===yd.getMonth()&&d.getDate()===yd.getDate()) return "昨天";
    }
    return k;
  }
  function sortDates(a){return a.slice().sort((x,y)=>{const dx=keyToDate(x),dy=keyToDate(y);return (dx?dx.getTime():0)-(dy?dy.getTime():0);});}

  function seed(){
    const t=todayStr();
    const s=[
      {title:"繁花",cat:"tv",platform:"腾讯视频",status:"watching",current:20,total:30,unit:"集",perep:45,rating:5,review:"腔调十足",note:"黄河路的烟火气",added:Date.now()-86400000*3,updated:Date.now(),last:t},
      {title:"三体",cat:"tv",platform:"腾讯视频",status:"done",current:30,total:30,unit:"集",perep:50,rating:5,review:"硬核",note:"",added:Date.now()-86400000*20,updated:Date.now()-86400000*5,last:""},
      {title:"奥本海默",cat:"movie",platform:"影院",status:"done",current:180,total:180,unit:"分钟",perep:0,rating:5,review:"震撼",note:"",added:Date.now()-86400000*10,updated:Date.now()-86400000*10,last:""},
      {title:"声入人心",cat:"variety",platform:"湖南卫视",status:"wish",current:0,total:12,unit:"集",perep:90,rating:0,review:"",note:"",added:Date.now()-86400000*2,updated:Date.now()-86400000*2,last:""},
      {title:"间谍过家家",cat:"anime",platform:"B站",status:"watching",current:10,total:25,unit:"集",perep:24,rating:4,review:"温馨",note:"",added:Date.now()-86400000*5,updated:Date.now(),last:t},
      {title:"日谈公园",cat:"podcast",platform:"小宇宙",status:"watching",current:3,total:0,unit:"期",perep:80,rating:4,review:"聊得透",note:"",added:Date.now()-86400000*4,updated:Date.now(),last:t},
      {title:"地球脉动",cat:"doc",platform:"BBC",status:"wish",current:0,total:0,unit:"分钟",perep:0,rating:0,review:"",note:"",added:Date.now()-86400000*1,updated:Date.now()-86400000*1,last:""}
    ];
    s.forEach(x=>{x.id=uid();});
    return s;
  }

  function totalMinutes(it){
    const total=Number(it.total)||0;
    if(it.unit==="分钟") return total;
    const pep=Number(it.perep)||0;
    return total*pep;
  }
  function watchedMinutes(it){
    const total=Number(it.total)||0;
    if(total<=0) return 0;
    const p=Math.min(1,Math.max(0,(Number(it.current)||0)/total));
    return Math.round(totalMinutes(it)*p);
  }
  function pct(it){
    const total=Number(it.total)||0;
    if(total<=0) return 0;
    return Math.min(100,Math.round((Number(it.current)||0)/total*100));
  }
  function stars(n){
    n=Number(n)||0;let s="";
    for(let i=1;i<=5;i++){s+= i<=n?'<span>★</span>':'<span class="off">★</span>';}
    return s;
  }

  let toastTimer=null;
  function toast(msg){
    const t=document.getElementById("toast");
    t.textContent=msg;t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
  }

  function renderCatFilters(){
    const box=document.getElementById("catFilters");
    let html='<div class="chip'+(filter.cat==="all"?" active":"")+'" data-cat="all">全部</div>';
    for(const k in CAT){
      const c=CAT[k];
      const cnt=items.filter(i=>i.cat===k).length;
      html+='<div class="chip'+(filter.cat===k?" active":"")+'" data-cat="'+k+'"><span class="dot" style="background:'+c.color+'"></span>'+c.name+' <span style="opacity:.6;font-size:11px">'+cnt+'</span></div>';
    }
    html+='<div class="chip dashed" id="addCatChip">＋ 分类</div>';
    box.innerHTML=html;
    box.querySelectorAll(".chip").forEach(ch=>{
      ch.onclick=()=>{
        if(ch.id==="addCatChip"){openCatModal();return;}
        filter.cat=ch.dataset.cat;renderCatFilters();renderList();
      };
    });
  }

  function renderStats(){
    const total=items.length;
    const wish=items.filter(i=>i.status==="wish").length;
    const watching=items.filter(i=>i.status==="watching").length;
    const done=items.filter(i=>i.status==="done").length;
    const dropped=items.filter(i=>i.status==="dropped").length;
    const mins=items.reduce((a,i)=>a+watchedMinutes(i),0);
    const hrs=(mins/60).toFixed(1);
    const data=[
      {n:total,l:"总记录"},{n:watching,l:"在看"},{n:done,l:"看过"},
      {n:wish,l:"想看"},{n:dropped,l:"弃剧"},{n:hrs,l:"已看(小时)"}
    ];
    document.getElementById("stats").innerHTML=data.map(d=>'<div class="stat glass"><div class="num">'+d.n+'</div><div class="lbl">'+d.l+'</div></div>').join("");
  }

  function renderList(){
    const grid=document.getElementById("grid");
    let list=items.slice();
    if(filter.cat!=="all") list=list.filter(i=>i.cat===filter.cat);
    if(filter.status!=="all") list=list.filter(i=>i.status===filter.status);
    if(filter.q){const q=filter.q.toLowerCase();list=list.filter(i=>(i.title+" "+(i.platform||"")).toLowerCase().includes(q));}
    list.sort((a,b)=>(b.updated||0)-(a.updated||0));
    if(!list.length){grid.innerHTML='<div class="empty">还没有记录，点右上角「＋ 添加」开始吧</div>';return;}
    grid.innerHTML=list.map(it=>{
      const c=CAT[it.cat]||CAT.tv;
      const st=STATUS[it.status]||STATUS.wish;
      const p=pct(it);
      const progTxt= it.total>0 ? (it.current+" / "+it.total+" "+it.unit+" · "+p+"%") : (it.unit==="分钟"?("已看 "+it.current+" 分钟"):("已看 "+it.current+" "+it.unit));
      return '<div class="card glass">'+
        (it.rating?'<div class="stars">'+stars(it.rating)+'</div>':'')+
        '<div class="meta"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:'+c.color+'"></span><span class="cn">'+c.name+'</span>'+
          (it.platform?'<span class="sep">·</span><span class="pf">'+esc(it.platform)+'</span>':'')+
        '</div>'+
        '<div class="name">'+esc(it.title)+'</div>'+
        '<div class="stat-line"><span class="sd" style="background:'+st.color+'"></span>'+st.name+'<span class="sep">·</span>'+progTxt+'</div>'+
        '<div class="bar"><i style="width:'+p+'%"></i></div>'+
        '<div class="acts">'+
          '<button class="mini primary" data-act="today" data-id="'+it.id+'">今日已看</button>'+
          '<button class="mini" data-act="edit" data-id="'+it.id+'">编辑</button>'+
          '<button class="mini danger" data-act="del" data-id="'+it.id+'">删除</button>'+
        '</div>'+
      '</div>';
    }).join("");
    grid.querySelectorAll(".mini").forEach(b=>{
      b.onclick=()=>{
        const id=b.dataset.id,act=b.dataset.act;
        if(act==="today") markToday(id);
        else if(act==="edit") openModal(id);
        else if(act==="del") delItem(id);
      };
    });
  }

  function esc(s){return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
  function hexA(hex,a){
    hex=(hex||"#5b9df9").replace("#","");
    if(hex.length===3) hex=hex.split("").map(x=>x+x).join("");
    const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
    return "rgba("+r+","+g+","+b+","+a+")";
  }
  function pad2(n){return String(n).padStart(2,"0");}
  function fmtTime(ts){const d=new Date(ts);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());}

  function markToday(id){
    const it=items.find(i=>i.id===id);if(!it)return;
    const t=todayStr();
    it.last=t;
    it.marks=it.marks||{};
    it.marks[t]=true;
    if(Number(it.total)>0 && Number(it.current)<Number(it.total)) it.current=Number(it.current)+1;
    else if(Number(it.total)>0) it.status="done";
    it.updated=Date.now();
    save();renderAll();
    toast("已记录今天看过「"+it.title+"」");
  }
  function delItem(id){
    const it=items.find(i=>i.id===id);
    if(!confirm("确定删除"+(it?("「"+it.title+"」"):"")+"这条记录？")) return;
    items=items.filter(i=>i.id!==id);
    save();renderAll();
    toast("已删除");
  }

  function renderReport(){
    const y=year();
    document.getElementById("reportYearTitle").textContent=y+" 年回顾";
    const thisYear=items.filter(i=>i.added && new Date(i.added).getFullYear()===y);
    const doneThisYear=items.filter(i=>i.status==="done" && i.updated && new Date(i.updated).getFullYear()===y);
    const mins=items.reduce((a,i)=>a+watchedMinutes(i),0);
    const rs=[
      {n:thisYear.length,t:"今年新增"},
      {n:doneThisYear.length,t:"今年看完"},
      {n:(mins/60).toFixed(0),t:"累计小时"},
      {n:items.filter(i=>i.status==="watching").length,t:"仍在追"}
    ];
    document.getElementById("reportStats").innerHTML=rs.map(r=>'<div class="rs"><div class="n">'+r.n+'</div><div class="t">'+r.t+'</div></div>').join("");

    const counts={};let max=0;
    for(const k in CAT){counts[k]=items.filter(i=>i.cat===k).length;max=Math.max(max,counts[k]);}
    document.getElementById("catBars").innerHTML=Object.keys(CAT).map(k=>{
      const c=CAT[k];const v=counts[k];const w=max>0?Math.round(v/max*100):0;
      return '<div class="cat-bar"><span class="nm">'+c.name+'</span><span class="track"><i style="width:'+w+'%;background:'+c.color+'"></i></span><span class="vv">'+v+'</span></div>';
    }).join("");

    renderBadges();
  }

  function renderBadges(){
    const done=items.filter(i=>i.status==="done").length;
    const mins=items.reduce((a,i)=>a+watchedMinutes(i),0);
    const hrs=mins/60;
    const wish=items.filter(i=>i.status==="wish").length;
    const cats=new Set(items.map(i=>i.cat)).size;
    const dropped=items.filter(i=>i.status==="dropped").length;
    const todayWatched=items.some(i=>i.last===todayStr());
    const B=[
      {c:"#7fd6a6",n:"追剧萌新",on:done>=1},
      {c:"#ff8fc4",n:"追剧达人",on:done>=5},
      {c:"#c3b1e6",n:"追剧大师",on:done>=15},
      {c:"#5b9df9",n:"时间管理",on:hrs>=20},
      {c:"#ffb84d",n:"计划狂魔",on:wish>=10},
      {c:"#6fd0d8",n:"全能观众",on:cats>=5},
      {c:"#a0a0b0",n:"不弃坑",on:dropped===0&&done>=3},
      {c:"#ff9e7a",n:"日更战士",on:todayWatched}
    ];
    document.getElementById("badges").innerHTML=B.map(b=>'<div class="badge'+(b.on?" on":"")+'"><span class="bd" style="background:'+b.c+'"></span><span>'+b.n+'</span></div>').join("");
  }

  function renderSaveMeta(){
    let last=0;
    try{last=Number(localStorage.getItem(BACKUP_KEY))||0;}catch(e){}
    const when= last? ("上次保存备份："+fmtTime(last)) : "还没有保存过备份文件";
    document.getElementById("saveMeta").textContent="自动保存已开启 · 当前共 "+items.length+" 条记录 · "+when;
  }

  function fillCatSelect(){
    const sel=document.getElementById("f_cat");
    sel.innerHTML=Object.keys(CAT).map(k=>'<option value="'+k+'">'+CAT[k].name+'</option>').join("");
  }
  function setRate(n){
    curRate=n;
    document.querySelectorAll("#ratePick span").forEach(s=>s.classList.toggle("on",Number(s.dataset.v)<=n));
  }
  function syncUnit(){
    const c=CAT[document.getElementById("f_cat").value];
    const uSel=document.getElementById("f_unit");
    uSel.value=c.unit;
    document.getElementById("perEpWrap").style.display=(c.unit==="分钟")?"none":"block";
  }
  function setDates(list){
    const seen={};pendingDates=[];
    sortDates((list||[]).map(k=>keyFromInput(inputFromKey(k))||k).filter(Boolean)).forEach(k=>{if(k&&!seen[k]){seen[k]=true;pendingDates.push(k);}});
    renderDateChips();
  }
  function renderDateChips(){
    const box=document.getElementById("datesList");
    if(!pendingDates.length){
      box.innerHTML='<span class="date-empty">未记录观看日期（日历中不会有色条）</span>';
      return;
    }
    box.innerHTML=pendingDates.map(k=>{
      const t=todayStr();
      return '<span class="date-chip'+(k===t?" today":"")+'" data-k="'+k+'"><b>'+dateLabel(k)+'</b><i data-rm="'+k+'">×</i></span>';
    }).join("");
    box.querySelectorAll("i[data-rm]").forEach(el=>{
      el.onclick=()=>{pendingDates=pendingDates.filter(x=>x!==el.dataset.rm);renderDateChips();};
    });
  }
  function addDateFromInput(){
    const inp=document.getElementById("f_date");
    const k=keyFromInput(inp.value);
    if(!k){toast("请先选择日期");return;}
    if(pendingDates.indexOf(k)>=0){toast("这天已经记过了");return;}
    pendingDates=sortDates(pendingDates.concat([k]));
    renderDateChips();
  }
  function openModal(id){
    editingId=id||null;
    document.getElementById("modalTitle").textContent=id?"编辑记录":"添加记录";
    fillCatSelect();
    if(id){
      const it=items.find(i=>i.id===id);
      document.getElementById("f_title").value=it.title||"";
      document.getElementById("f_cat").value=it.cat||"tv";
      document.getElementById("f_status").value=it.status||"wish";
      document.getElementById("f_platform").value=it.platform||"";
      document.getElementById("f_current").value=it.current||0;
      document.getElementById("f_total").value=it.total||0;
      document.getElementById("f_unit").value=it.unit||CAT[it.cat].unit;
      document.getElementById("f_perep").value=it.perep||0;
      document.getElementById("f_review").value=it.review||"";
      document.getElementById("f_note").value=it.note||"";
      setRate(it.rating||0);
      setDates(Object.keys(it.marks||{}).filter(k=>it.marks[k]));
      document.getElementById("f_date").value=inputFromKey(pendingDates.length?pendingDates[pendingDates.length-1]:todayStr());
    }else{
      document.getElementById("f_title").value="";
      document.getElementById("f_cat").value="tv";
      document.getElementById("f_status").value="wish";
      document.getElementById("f_platform").value="";
      document.getElementById("f_current").value=0;
      document.getElementById("f_total").value=0;
      document.getElementById("f_perep").value=0;
      document.getElementById("f_review").value="";
      document.getElementById("f_note").value="";
      setRate(0);
      setDates([todayStr()]);
      document.getElementById("f_date").value=inputFromKey(todayStr());
    }
    syncUnit();
    document.getElementById("mask").classList.add("show");
  }
  function closeModal(){document.getElementById("mask").classList.remove("show");}

  function saveModal(){
    const title=document.getElementById("f_title").value.trim();
    if(!title){alert("请填写片名");return;}
    const data={
      title:title,
      cat:document.getElementById("f_cat").value,
      status:document.getElementById("f_status").value,
      platform:document.getElementById("f_platform").value.trim(),
      current:Number(document.getElementById("f_current").value)||0,
      total:Number(document.getElementById("f_total").value)||0,
      unit:document.getElementById("f_unit").value,
      pep:Number(document.getElementById("f_perep").value)||0,
      rating:curRate,
      review:document.getElementById("f_review").value.trim(),
      note:document.getElementById("f_note").value.trim()
    };
    /* 观看日期 → marks（决定日历色条）。只认用户显式加入的日期，
       避免编辑旧记录时把输入框里的默认「今天」静默写进去污染历史。 */
    const dates=sortDates(pendingDates.slice()).filter(Boolean);
    const marks={};dates.forEach(k=>{marks[k]=true;});
    data.marks=marks;
    data.last=dates.length?dates[dates.length-1]:"";
    const hadId=editingId;
    if(editingId){
      const it=items.find(i=>i.id===editingId);
      Object.assign(it,data);it.updated=Date.now();
    }else{
      data.id=uid();data.added=Date.now();data.updated=Date.now();
      items.push(data);
    }
    save();closeModal();renderAll();
    const extra=dates.length?("，已记入 "+dates.length+" 天"):"（未记录观看日期）";
    toast(hadId?"已更新":"已添加「"+title+"」"+extra);
  }

  function openCatModal(){
    document.getElementById("cat_name").value="";
    document.getElementById("cat_unit").value="集";
    document.getElementById("cat_color").value=PALETTE[Object.keys(CAT).length % PALETTE.length];
    document.getElementById("catMask").classList.add("show");
  }
  function closeCatModal(){document.getElementById("catMask").classList.remove("show");}
  function saveCatModal(){
    const nm=document.getElementById("cat_name").value.trim();
    if(!nm){alert("请填写分类名称");return;}
    const key="c"+Date.now().toString(36);
    CAT[key]={name:nm,unit:document.getElementById("cat_unit").value,color:document.getElementById("cat_color").value};
    saveCats();closeCatModal();renderAll();
    toast("已新增分类「"+nm+"」");
  }

  /* 保存数据：导出一份备份文件，并记录备份时间 */
  function saveData(){
    const payload={app:"eyes on",savedAt:new Date().toISOString(),items:items,cats:CAT};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="eyes on 数据备份_"+todayStr()+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    try{localStorage.setItem(BACKUP_KEY,String(Date.now()));}catch(e){}
    renderSaveMeta();
    toast("已保存备份文件（"+items.length+" 条记录）");
  }
  function importData(file){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(d.items&&Array.isArray(d.items)){
          items=d.items;
          items.forEach(it=>{
            if(!it.marks||typeof it.marks!=="object") it.marks={};
            if(it.last && !Object.keys(it.marks).length) it.marks[it.last]=true;
          });
          if(d.cats&&typeof d.cats==="object"&&Object.keys(d.cats).length){CAT=d.cats;saveCats();}
          save();renderAll();
          toast("导入成功，共 "+items.length+" 条记录");
        }else alert("文件格式不正确");
      }catch(e){alert("解析失败");}
    };
    r.readAsText(file);
  }
  function clearData(){
    if(!confirm("将清空全部记录，建议先「保存数据」留一份备份。确定清空？"))return;
    items=[];save();renderAll();
    toast("已清空全部记录");
  }

  function downloadReport(){
    const c=document.createElement("canvas");
    const W=720,H=980;c.width=W;c.height=H;
    const x=c.getContext("2d");
    const g=x.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#a8d8ff");g.addColorStop(0.5,"#cfeffe");g.addColorStop(1,"#ffd9ec");
    x.fillStyle=g;x.fillRect(0,0,W,H);
    x.fillStyle="rgba(255,255,255,0.6)";
    roundRect(x,40,40,W-80,H-80,28);x.fill();
    x.fillStyle="#4a4a5a";x.font="bold 38px sans-serif";x.textAlign="center";
    x.fillText("eyes on · "+year()+" 回顾",W/2,120);
    const mins=items.reduce((a,i)=>a+watchedMinutes(i),0);
    const big=[
      {n:items.length,t:"总记录"},
      {n:items.filter(i=>i.status==="watching").length,t:"在看"},
      {n:items.filter(i=>i.status==="done").length,t:"看过"},
      {n:(mins/60).toFixed(0),t:"累计小时"}
    ];
    big.forEach((b,i)=>{
      const bx=90+i*140;
      x.fillStyle="#5b9df9";x.font="bold 44px sans-serif";x.fillText(b.n,bx,260);
      x.fillStyle="#8a8a99";x.font="15px sans-serif";x.fillText(b.t,bx,290);
    });
    x.fillStyle="#4a4a5a";x.font="bold 22px sans-serif";x.textAlign="left";
    x.fillText("类别分布",70,360);
    let yy=400;
    for(const k in CAT){
      const v=items.filter(i=>i.cat===k).length;
      x.fillStyle="#6a6a7a";x.font="15px sans-serif";
      x.fillText(CAT[k].name,70,yy);
      x.fillStyle="rgba(120,140,200,0.18)";roundRect(x,200,yy-12,420,16,8);x.fill();
      x.fillStyle=CAT[k].color;roundRect(x,200,yy-12,Math.max(8,items.length?(v/items.length*420):0),16,8);x.fill();
      x.fillStyle="#6a6a7a";x.font="14px sans-serif";x.textAlign="right";x.fillText(v,690,yy);x.textAlign="left";
      yy+=42;
    }
    x.fillStyle="rgba(120,140,200,0.5)";x.font="14px sans-serif";x.textAlign="center";
    x.fillText("由「eyes on」生成 · 数据存于本机",W/2,H-50);
    const a=document.createElement("a");
    a.href=c.toDataURL("image/png");
    a.download="eyes on 年度报告_"+year()+".png";a.click();
  }
  function roundRect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}

  function renderCal(){
    const y=calY,m=calM;
    document.getElementById("calTitle").textContent=y+" 年 "+(m+1)+" 月";
    const tk=todayStr();
    const first=new Date(y,m,1);
    const start=new Date(y,m,1-first.getDay());
    const MAXROWS=4;
    let html="";
    // 按周分配固定行（参考追文记 bookRowByWeek）：一周内同一部剧占同一行，连续多天横贯对齐
    for(let w=0; w<6; w++){
      const weekDays=[];
      for(let d=0; d<7; d++){const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);weekDays.push(dt);}
      const seen={}, weekItems=[];
      weekDays.forEach(dt=>{
        const key=dt.getFullYear()+"-"+(dt.getMonth()+1)+"-"+dt.getDate();
        items.forEach(it=>{if(it.marks&&it.marks[key]&&!seen[it.id]){seen[it.id]=true;weekItems.push(it);}});
      });
      weekItems.sort((a,b)=>(b.updated||0)-(a.updated||0));
      const shown=weekItems.slice(0,MAXROWS);
      for(let d=0; d<7; d++){
        const dt=weekDays[d];
        const key=dt.getFullYear()+"-"+(dt.getMonth()+1)+"-"+dt.getDate();
        const dim=dt.getMonth()!==m;const isT=key===tk;
        let rows="";
        shown.forEach(it=>{
          const c=CAT[it.cat]||CAT.tv;
          if(it.marks[key]){
            rows+='<div class="cal-row" data-id="'+it.id+'" style="background:'+hexA(c.color,0.75)+';border-color:'+hexA(c.color,0.92)+'"><span class="cal-tt">'+esc(it.title)+'</span></div>';
          }else{
            rows+='<div class="cal-row ph"></div>';
          }
        });
        html+='<div class="cal-cell'+(dim?" dim":"")+(isT?" today":"")+'"><div class="cal-dn">'+dt.getDate()+'</div><div class="cal-rows">'+rows+'</div></div>';
      }
    }
    document.getElementById("calGrid").innerHTML=html;
    document.querySelectorAll("#calGrid .cal-row[data-id]").forEach(r=>{r.onclick=()=>openModal(r.dataset.id);});
  }

  function setView(v){
    view=v;
    document.querySelectorAll(".bottom-nav .tab").forEach(p=>p.classList.toggle("active",p.dataset.view===v));
    document.getElementById("viewList").classList.toggle("hidden",v!=="list");
    document.getElementById("viewCal").classList.toggle("hidden",v!=="cal");
    document.getElementById("viewData").classList.toggle("hidden",v!=="data");
    if(v==="cal") renderCal();
    if(v==="data") renderSaveMeta();
    window.scrollTo({top:0,behavior:"smooth"});
  }
  function stepMonth(d){
    calM+=d;
    if(calM<0){calM=11;calY--;}else if(calM>11){calM=0;calY++;}
    renderCal();
  }
  function gotoToday(){const n=new Date();calY=n.getFullYear();calM=n.getMonth();renderCal();}
  function renderAll(){renderCatFilters();renderStats();renderList();renderReport();renderCal();renderSaveMeta();}

  document.getElementById("addBtn").onclick=()=>openModal(null);
  document.getElementById("cancelBtn").onclick=closeModal;
  document.getElementById("saveBtn").onclick=saveModal;
  document.getElementById("mask").onclick=e=>{if(e.target.id==="mask")closeModal();};
  document.getElementById("search").oninput=e=>{
    filter.q=e.target.value;
    if(view!=="list") setView("list");
    renderList();
  };
  document.querySelectorAll(".pill[data-status]").forEach(p=>{
    p.onclick=()=>{
      document.querySelectorAll(".pill[data-status]").forEach(q=>q.classList.remove("active"));
      p.classList.add("active");filter.status=p.dataset.status;renderList();
    };
  });
  document.getElementById("f_cat").onchange=syncUnit;
  document.querySelectorAll("#ratePick span").forEach(s=>{
    s.onclick=()=>setRate(Number(s.dataset.v));
  });
  document.getElementById("addDateBtn").onclick=addDateFromInput;
  document.getElementById("f_date").onchange=addDateFromInput;
  document.getElementById("f_date").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addDateFromInput();}};
  document.getElementById("saveDataBtn").onclick=saveData;
  document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
  document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value="";};
  document.getElementById("clearBtn").onclick=clearData;
  document.getElementById("downloadReport").onclick=downloadReport;
  document.getElementById("catCancel").onclick=closeCatModal;
  document.getElementById("catSave").onclick=saveCatModal;
  document.getElementById("catMask").onclick=e=>{if(e.target.id==="catMask")closeCatModal();};

  document.querySelectorAll(".bottom-nav .tab").forEach(p=>{
    p.onclick=()=>setView(p.dataset.view);
  });
  document.getElementById("calPrev").onclick=()=>stepMonth(-1);
  document.getElementById("calNext").onclick=()=>stepMonth(1);
  document.getElementById("calToday").onclick=gotoToday;

  renderAll();
  setView("list");
})();
</script>
</body>
</html>
